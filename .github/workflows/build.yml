name: Build JARVIS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find and move files to root
        run: |
          $sub = Get-ChildItem -Directory | Where-Object { Test-Path "$($_.FullName)\package.json" } | Select-Object -First 1
          if ($sub) {
            Write-Host "Moving files from $($sub.Name) to root"
            Get-ChildItem $sub.FullName | Move-Item -Destination . -Force
            Remove-Item $sub.FullName -Recurse -Force
          }
        shell: pwsh
      - run: npm install
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: dist/*.exe
